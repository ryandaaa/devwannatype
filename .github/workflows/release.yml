name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            file

      - name: install frontend deps
        run: bun install

      - name: generate icons (mac .icns + linux PNG)
        run: bun x tauri icon src-tauri/icons/source.png --output src-tauri/icons

      - name: build with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "devwannatype ${{ github.ref_name }}"
          releaseBody: |
            see [Release notes](https://github.com/ryandaaa/devwannatype/blob/${{ github.ref_name }}/installers/RELEASE_NOTES_v1.0.0.md) for full details.

            **Windows users**: installer is not code-signed.
            click `More info → Run anyway` on SmartScreen prompt.
            verify SHA256 in release notes.

            **macOS users**: app is not signed/notarized.
            right-click the .app → `Open` → confirm to bypass Gatekeeper on first run.

            **Linux users**: pick `.deb` (Debian/Ubuntu), `.rpm` (Fedora/RHEL), or `.AppImage` (universal).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
