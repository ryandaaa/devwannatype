name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf

      - name: install frontend deps
        run: bun install

      - name: generate icons (mac .icns + linux PNG)
        run: bun x tauri icon src-tauri/icons/source.png --output src-tauri/icons

      - name: build with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "devwannatype ${{ github.ref_name }}"
          releaseBody: |
            cross-platform desktop builds for **${{ github.ref_name }}**.

            **Windows**: pick the `.msi` (MSI installer) or `.exe` (NSIS setup).
            installer is not code-signed — Windows SmartScreen will warn on first run.
            click `More info → Run anyway` to proceed.

            **macOS**: pick the `.dmg` (universal binary, Intel + Apple Silicon).
            app is not notarized — right-click the .app → `Open` → `Open` to bypass
            Gatekeeper on first run.

            **Linux**: pick `.deb` (Debian/Ubuntu), `.rpm` (Fedora/RHEL), or
            `.AppImage` (universal portable). For AppImage, `chmod +x` then run.

            data folder per OS:
            - Windows: `%APPDATA%\dev.wannatype.app\devwannatype.db`
            - macOS:   `~/Library/Application Support/dev.wannatype.app/devwannatype.db`
            - Linux:   `~/.local/share/dev.wannatype.app/devwannatype.db`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
